<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DeepSeek Translator</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="panel">
      <header class="header">
        <div>
          <h1 data-i18n="popupTitle">DeepSeek Translator</h1>
          <p id="domainText" data-i18n="domainLoading">Loading current domain...</p>
        </div>
        <label class="switch" title="Enable continuous translation for this domain" data-i18n-title="domainSwitchTitle">
          <input id="enabledInput" type="checkbox">
          <span></span>
        </label>
      </header>

      <section class="field">
        <label for="apiKeyInput" data-i18n="apiKeyLabel">API Key</label>
        <input id="apiKeyInput" type="password" placeholder="sk-..." data-i18n-placeholder="apiKeyPlaceholder" autocomplete="off">
      </section>

      <section class="row">
        <label class="field compact" for="targetLangInput">
          <span data-i18n="targetLanguageLabel">Target language</span>
          <select id="targetLangInput">
            <option value="zh-CN" data-i18n="languageZhCn">Simplified Chinese</option>
            <option value="zh-TW" data-i18n="languageZhTw">Traditional Chinese</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
            <option value="fr">Français</option>
            <option value="de">Deutsch</option>
            <option value="es">Español</option>
          </select>
        </label>
        <label class="field compact" for="modelInput">
          <span data-i18n="modelLabel">Model</span>
          <select id="modelInput">
            <option value="deepseek-v4-flash">V4 Flash</option>
            <option value="deepseek-v4-pro">V4 Pro</option>
          </select>
        </label>
      </section>

      <section class="actions">
        <button id="translateButton" type="button" data-i18n="translateCurrentPageButton">Translate page</button>
        <button id="restoreButton" type="button" class="secondary" data-i18n="restoreOriginalButton">Restore original</button>
      </section>

      <section class="actions">
        <button id="clearCacheButton" type="button" class="secondary" data-i18n="clearCacheButton">Clear cache</button>
        <button id="saveButton" type="button" class="secondary" data-i18n="saveSettingsButton">Save settings</button>
      </section>

      <section class="site-settings">
        <div class="section-title">
          <h2 data-i18n="enabledSitesTitle">Enabled sites</h2>
          <span id="enabledSiteCount">0</span>
        </div>
        <div id="enabledSitesList" class="sites-list"></div>
      </section>

      <p id="statusText" class="status"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
