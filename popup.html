<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DeepSeek Translator</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="panel">
      <header class="header">
        <div>
          <h1>DeepSeek 翻译</h1>
          <p id="domainText">读取当前域名中...</p>
        </div>
        <label class="switch" title="为当前域名开启持续翻译">
          <input id="enabledInput" type="checkbox">
          <span></span>
        </label>
      </header>

      <section class="field">
        <label for="apiKeyInput">API Key</label>
        <input id="apiKeyInput" type="password" placeholder="sk-..." autocomplete="off">
      </section>

      <section class="row">
        <label class="field compact" for="targetLangInput">
          <span>目标语言</span>
          <select id="targetLangInput">
            <option value="zh-CN">简体中文</option>
            <option value="zh-TW">繁体中文</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
            <option value="fr">Français</option>
            <option value="de">Deutsch</option>
            <option value="es">Español</option>
          </select>
        </label>
        <label class="field compact" for="modelInput">
          <span>模型</span>
          <select id="modelInput">
            <option value="deepseek-v4-flash">V4 Flash</option>
            <option value="deepseek-v4-pro">V4 Pro</option>
          </select>
        </label>
      </section>

      <section class="actions">
        <button id="translateButton" type="button">翻译当前页</button>
        <button id="restoreButton" type="button" class="secondary">恢复原文</button>
      </section>

      <section class="actions">
        <button id="clearCacheButton" type="button" class="secondary">清除缓存</button>
        <button id="saveButton" type="button" class="secondary">保存设置</button>
      </section>

      <section class="site-settings">
        <div class="section-title">
          <h2>已开启的网站</h2>
          <span id="enabledSiteCount">0</span>
        </div>
        <div id="enabledSitesList" class="sites-list"></div>
      </section>

      <p id="statusText" class="status"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
